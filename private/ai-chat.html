<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Command Centre — SP Digital</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
background: #f7f5ff;
min-height: 100vh;
display: flex;
}

/* Sidebar */
.sidebar {
width: 280px;
background: #2a1b47;
color: white;
display: flex;
flex-direction: column;
border-right: 1px solid #444;
}

.sidebar-header {
padding: 20px;
border-bottom: 1px solid #444;
}

.sidebar-header h2 {
font-size: 18px;
margin-bottom: 12px;
}

.new-chat-btn {
width: 100%;
padding: 10px 14px;
background: #7c3aed;
color: white;
border: none;
border-radius: 8px;
font-size: 14px;
cursor: pointer;
transition: background 0.2s;
}

.new-chat-btn:hover {
background: #6d28d9;
}

.chat-list {
flex: 1;
overflow-y: auto;
padding: 12px;
}

.chat-item {
padding: 10px 12px;
border-radius: 6px;
margin-bottom: 6px;
cursor: pointer;
display: flex;
justify-content: space-between;
align-items: center;
font-size: 14px;
background: transparent;
transition: background 0.2s;
}

.chat-item:hover, .chat-item.active {
background: #3c286b;
}

.chat-item-title {
flex: 1;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}

.chat-item-actions {
display: none;
gap: 4px;
}

.chat-item:hover .chat-item-actions {
display: flex;
}

.chat-action-btn {
background: none;
border: none;
color: #aaa;
cursor: pointer;
font-size: 12px;
padding: 2px 6px;
}

.chat-action-btn:hover {
color: white;
}

.empty-history {
color: #888;
font-size: 13px;
text-align: center;
padding: 30px 15px;
}

/* Main Chat Area */
.chat-container {
flex: 1;
display: flex;
flex-direction: column;
max-width: 100%;
}

.chat-header {
background: linear-gradient(135deg, #6d28d9, #7c3aed);
color: white;
padding: 20px 24px;
}

.chat-header h1 {
font-size: 20px;
margin-bottom: 8px;
}

.model-selector {
display: flex;
gap: 10px;
margin-top: 10px;
flex-wrap: wrap;
}

.model-btn {
padding: 6px 14px;
background: rgba(255,255,255,0.2);
border: none;
color: white;
border-radius: 20px;
cursor: pointer;
font-size: 13px;
}

.model-btn.active {
background: white;
color: #6d28d9;
font-weight: 600;
}

.chat-messages {
flex: 1;
padding: 24px;
overflow-y: auto;
background: white;
}

.welcome-box {
text-align: center;
padding: 60px 20px;
color: #6b7280;
}

.message {
margin-bottom: 20px;
padding: 14px 18px;
border-radius: 16px;
max-width: 80%;
line-height: 1.5;
}

.user-message {
background: #7c3aed;
color: white;
margin-left: auto;
border-bottom-right-radius: 4px;
}

.assistant-message {
background: #f3f4f6;
color: #1f2937;
margin-right: auto;
border-bottom-left-radius: 4px;
}

.error-message {
background: #fee2e2;
color: #dc2626;
max-width: 80%;
padding: 12px 16px;
border-radius: 8px;
margin-bottom: 16px;
}

.input-area {
padding: 20px 24px;
border-top: 1px solid #e5e7eb;
background: white;
}

.input-wrapper {
display: flex;
gap: 12px;
align-items: flex-end;
}

#userInput {
flex: 1;
padding: 14px 18px;
border: 2px solid #e5e7eb;
border-radius: 12px;
font-size: 15px;
outline: none;
transition: border-color 0.2s;
resize: none;
min-height: 52px;
max-height: 120px;
}

#userInput:focus {
border-color: #7c3aed;
}

.send-btn {
padding: 14px 28px;
background: #7c3aed;
color: white;
border: none;
border-radius: 12px;
font-size: 15px;
font-weight: 600;
cursor: pointer;
transition: background 0.2s;
height: 52px;
}

.send-btn:disabled {
background: #c4b5fd;
cursor: not-allowed;
}

.send-btn:hover:not(:disabled) {
background: #6d28d9;
}

.toolbar {
display: flex;
gap: 10px;
margin-top: 12px;
flex-wrap: wrap;
}

.toolbar-btn {
padding: 6px 12px;
background: #f3f4f6;
border: none;
border-radius: 6px;
font-size: 13px;
cursor: pointer;
color: #4b5563;
display: flex;
align-items: center;
gap: 5px;
}

.toolbar-btn:hover {
background: #e5e7eb;
}

.saving-indicator {
font-size: 12px;
color: #7c3aed;
margin-left: auto;
}

/* Rename Modal */
.modal-overlay {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.5);
display: flex;
align-items: center;
justify-content: center;
z-index: 1000;
display: none;
}

.modal-content {
background: white;
padding: 24px;
border-radius: 12px;
width: 90%;
max-width: 400px;
}

.modal-content h3 {
margin-bottom: 16px;
font-size: 18px;
}

.modal-input {
width: 100%;
padding: 10px 14px;
border: 2px solid #e5e7eb;
border-radius: 8px;
font-size: 15px;
margin-bottom: 16px;
}

.modal-buttons {
display: flex;
gap: 10px;
justify-content: flex-end;
}

.modal-btn {
padding: 8px 16px;
border-radius: 6px;
font-size: 14px;
cursor: pointer;
border: none;
}

.modal-btn.cancel {
background: #e5e7eb;
}

.modal-btn.confirm {
background: #7c3aed;
color: white;
}

@media (max-width: 768px) {
body {
flex-direction: column;
}
.sidebar {
width: 100%;
max-height: 200px;
}
.message {
max-width: 90%;
}
.formatted h1, .formatted h2, .formatted h3 {
margin: 0.5em 0 0.3em 0;
font-weight: 700;
line-height: 1.3;
}
.formatted h1 { font-size: 1.4em; }
.formatted h2 { font-size: 1.25em; }
.formatted h3 { font-size: 1.1em; }
.formatted p { margin: 0.5em 0; }
.formatted ul { margin: 0.6em 0; padding-left: 22px; }
.formatted li { margin: 0.3em 0; }
.formatted strong { font-weight: 600; }
.formatted em { font-style: italic; }
}
</style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
<div class="sidebar-header">
<h2>💬 Chat History</h2>
<button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
</div>
<div class="chat-list" id="chatList">
<div class="empty-history">No saved conversations yet</div>
</div>
</div>

<!-- Main Chat Area -->
<div class="chat-container">
<div class="chat-header">
<h1>🤖 SP Digital AI Assistant</h1>
<p>Your intelligent workspace — always ready</p>
<div class="model-selector">
<button class="model-btn active" data-model="gpt-4o-mini">GPT-4o Mini</button>
<button class="model-btn" data-model="gpt-4o">GPT-4o</button>
<button class="model-btn" data-model="gpt-4-turbo">GPT-4 Turbo</button>
</div>
</div>

<div class="chat-messages" id="chatMessages">
<div class="welcome-box" id="welcomeBox">
<h2>👋 Welcome to your AI Assistant</h2>
<p>Start typing below to begin a new conversation. Your chats are automatically saved.</p>
</div>
</div>

<div class="input-area">
<div class="input-wrapper">
<textarea id="userInput" placeholder="Type your message here..." rows="1"></textarea>
<button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
</div>
<div class="toolbar">
<button class="toolbar-btn" onclick="clearChat()">🗑️ Clear Chat</button>
<button class="toolbar-btn" onclick="downloadChat()">⬇️ Download</button>
<span class="saving-indicator" id="savingIndicator"></span>
</div>
</div>
</div>

<!-- Rename Modal -->
<div class="modal-overlay" id="renameModal">
<div class="modal-content">
<h3>Rename Conversation</h3>
<input type="text" class="modal-input" id="renameInput" placeholder="Enter new name...">
<div class="modal-buttons">
<button class="modal-btn cancel" onclick="closeRenameModal()">Cancel</button>
<button class="modal-btn confirm" onclick="confirmRename()">Save</button>
</div>
</div>
</div>

<script>
// Global state
let selectedModel = 'gpt-4o-mini';
let conversationHistory = [];
let currentConversationId = null;
let renameTargetId = null;

// Model selection
document.querySelectorAll('.model-btn').forEach(btn => {
btn.addEventListener('click', () => {
document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
selectedModel = btn.dataset.model;
});
});

// Load chat list on page open
loadChatList();

// Auto-resize textarea
const input = document.getElementById('userInput');
input.addEventListener('input', () => {
input.style.height = 'auto';
input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// Enter to send
input.addEventListener('keydown', (e) => {
if (e.key === 'Enter' && !e.shiftKey) {
e.preventDefault();
sendMessage();
}
});

// --- Chat Management ---

async function createNewChat() {
currentConversationId = 'conv_' + Date.now();
conversationHistory = [];
document.getElementById('chatMessages').innerHTML = `
<div class="welcome-box" id="welcomeBox">
<h2>👋 New Conversation</h2>
<p>Start typing below to begin...</p>
</div>
`;
document.querySelector('.chat-header h1').textContent = '🤖 SP Digital AI Assistant';
await saveConversation();
loadChatList();
}

async function saveConversation(title = null) {
if (!currentConversationId || conversationHistory.length === 0) return;

const chatTitle = title || generateTitle();
const conversations = JSON.parse(localStorage.getItem('ai_conversations') || '{}');

conversations[currentConversationId] = {
id: currentConversationId,
title: chatTitle,
messages: conversationHistory,
updatedAt: new Date().toISOString()
};

localStorage.setItem('ai_conversations', JSON.stringify(conversations));
showSavingIndicator('Saved ✓');
}

function generateTitle() {
const firstMessage = conversationHistory.find(m => m.role === 'user');
if (firstMessage) {
return firstMessage.content.substring(0, 25) + (firstMessage.content.length > 25 ? '...' : '');
}
return 'New Chat';
}

function showSavingIndicator(text) {
const indicator = document.getElementById('savingIndicator');
indicator.textContent = text;
setTimeout(() => indicator.textContent = '', 2000);
}

function loadChatList() {
const container = document.getElementById('chatList');
const conversations = JSON.parse(localStorage.getItem('ai_conversations') || '{}');
const sorted = Object.values(conversations).sort((a, b) =>
new Date(b.updatedAt) - new Date(a.updatedAt)
);

if (sorted.length === 0) {
container.innerHTML = '<div class="empty-history">No saved conversations yet</div>';
return;
}

container.innerHTML = sorted.map(chat => `
<div class="chat-item ${chat.id === currentConversationId ? 'active' : ''}"
onclick="loadConversation('${chat.id}')">
<span class="chat-item-title">${escapeHtml(chat.title)}</span>
<div class="chat-item-actions">
<button class="chat-action-btn" title="Rename" onclick="event.stopPropagation(); openRenameModal('${chat.id}', '${escapeForJS(chat.title)}')">✏️</button>
<button class="chat-action-btn" title="Delete" onclick="event.stopPropagation(); deleteConversation('${chat.id}')">🗑️</button>
</div>
</div>
`).join('');
}

function loadConversation(id) {
const conversations = JSON.parse(localStorage.getItem('ai_conversations') || '{}');
const chat = conversations[id];
if (!chat) return;

currentConversationId = id;
conversationHistory = chat.messages;

// Update page title
document.querySelector('.chat-header h1').textContent = '🤖 ' + chat.title;

// Render messages
const container = document.getElementById('chatMessages');
container.innerHTML = '';

conversationHistory.forEach(msg => {
addMessage(msg.role, msg.content, false);
});

loadChatList();
}

async function deleteConversation(id) {
if (!confirm('Delete this conversation? This cannot be undone.')) return;

const conversations = JSON.parse(localStorage.getItem('ai_conversations') || '{}');
delete conversations[id];
localStorage.setItem('ai_conversations', JSON.stringify(conversations));

if (currentConversationId === id) {
currentConversationId = null;
conversationHistory = [];
document.getElementById('chatMessages').innerHTML = `
<div class="welcome-box" id="welcomeBox">
<h2>👋 Welcome to your AI Assistant</h2>
<p>Start typing below to begin a new conversation. Your chats are automatically saved.</p>
</div>
`;
document.querySelector('.chat-header h1').textContent = '🤖 SP Digital AI Assistant';
}

loadChatList();
}

function openRenameModal(id, currentTitle) {
renameTargetId = id;
document.getElementById('renameInput').value = currentTitle;
document.getElementById('renameModal').style.display = 'flex';
}

function closeRenameModal() {
renameTargetId = null;
document.getElementById('renameModal').style.display = 'none';
}

async function confirmRename() {
const newTitle = document.getElementById('renameInput').value.trim();
if (!newTitle || !renameTargetId) {
closeRenameModal();
return;
}

const conversations = JSON.parse(localStorage.getItem('ai_conversations') || '{}');
if (conversations[renameTargetId]) {
// Re-save with new title
conversations[renameTargetId].title = newTitle;
localStorage.setItem('ai_conversations', JSON.stringify(conversations));

// Update header if this is the active chat
if (renameTargetId === currentConversationId) {
document.querySelector('.chat-header h1').textContent = '🤖 ' + newTitle;
}
}

closeRenameModal();
loadChatList();
}

// --- Messaging ---

async function sendMessage() {
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const message = input.value.trim();

if (!message) return;

// Create conversation if none exists
if (!currentConversationId) {
currentConversationId = 'conv_' + Date.now();
conversationHistory = [];
}

// Hide welcome box
const welcomeBox = document.getElementById('welcomeBox');
if (welcomeBox) welcomeBox.style.display = 'none';

// Add user message
addMessage('user', message);
conversationHistory.push({ role: 'user', content: message });

// Clear input
input.value = '';
input.style.height = 'auto';

// Disable send
sendBtn.disabled = true;

try {
// Build messages array
const messages = conversationHistory.map(m => ({
role: m.role,
content: m.content
}));

// Send to proxy
const response = await fetch('/api/openai-proxy', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
model: selectedModel,
messages: messages
})
});

const responseText = await response.text();
let data;
try {
data = JSON.parse(responseText);
} catch {
throw new Error(`Server error: ${responseText.substring(0, 100)}`);
}

if (!response.ok || data.error) {
throw new Error(data.error?.message || `Error: ${response.status}`);
}

const assistantMessage = data.choices[0].message.content;
addMessage('assistant', assistantMessage);
conversationHistory.push({ role: 'assistant', content: assistantMessage });

// Auto-title on first reply
if (conversationHistory.length === 2) {
await saveConversation();
} else {
// Just update timestamp
const conversations = JSON.parse(localStorage.getItem('ai_conversations') || '{}');
if (conversations[currentConversationId]) {
conversations[currentConversationId].messages = conversationHistory;
conversations[currentConversationId].updatedAt = new Date().toISOString();
localStorage.setItem('ai_conversations', JSON.stringify(conversations));
showSavingIndicator('Saved ✓');
}
}

loadChatList();

} catch (error) {
console.error('Error:', error);
addErrorMessage(error.message);
} finally {
sendBtn.disabled = false;
}
}

function addMessage(role, content, animate = true) {
const container = document.getElementById('chatMessages');
const div = document.createElement('div');
div.className = `message ${role}-message formatted`;

// Convert markdown to clean HTML
let formatted = escapeHtml(content);

// Headings
formatted = formatted.replace(/^### (.*)$/gm, '<h3>$1</h3>');
formatted = formatted.replace(/^## (.*)$/gm, '<h2>$1</h2>');
formatted = formatted.replace(/^# (.*)$/gm, '<h1>$1</h1>');

// Bold and italic
formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');

// Lists
formatted = formatted.replace(/^- (.*)$/gm, '<li>$1</li>');
formatted = formatted.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

// Line breaks and paragraphs
formatted = formatted.replace(/\n\n/g, '</p><p>');
formatted = formatted.replace(/\n/g, '<br>');

// Wrap in paragraph if not already
if (!formatted.startsWith('<p>') && !formatted.startsWith('<h') && !formatted.startsWith('<ul>')) {
formatted = '<p>' + formatted + '</p>';
}

div.innerHTML = formatted;

if (animate) {
div.style.opacity = '0';
div.style.transform = 'translateY(10px)';
}

container.appendChild(div);

if (animate) {
setTimeout(() => {
div.style.transition = 'all 0.3s ease';
div.style.opacity = '1';
div.style.transform = 'translateY(0)';
}, 10);
}

container.scrollTop = container.scrollHeight;
}


function addErrorMessage(text) {
const container = document.getElementById('chatMessages');
const div = document.createElement('div');
div.className = 'error-message';
div.innerHTML = `⚠️ ${escapeHtml(text)}`;
container.appendChild(div);
container.scrollTop = container.scrollHeight;
}

function clearChat() {
if (!confirm('Clear current chat? Conversation history is still saved in the sidebar.')) return;

document.getElementById('chatMessages').innerHTML = `
<div class="welcome-box" id="welcomeBox">
<h2>👋 New Conversation</h2>
<p>Start typing below to begin...</p>
</div>
`;
conversationHistory = [];
currentConversationId = null;
document.querySelector('.chat-header h1').textContent = '🤖 SP Digital AI Assistant';
}

function downloadChat() {
if (conversationHistory.length === 0) {
alert('No conversation to download yet.');
return;
}

const title = generateTitle().replace(/[^a-z0-9]/gi, '-').substring(0, 30);
let text = `SP Digital — AI Conversation\n`;
text += `==============================\n`;
text += `Model: ${selectedModel}\n`;
text += `Date: ${new Date().toLocaleString()}\n`;
text += `==============================\n\n`;

conversationHistory.forEach(msg => {
text += `${msg.role === 'user' ? 'You' : 'AI'}:\n${msg.content}\n\n`;
});

const blob = new Blob([text], { type: 'text/plain' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `chat-${title}.txt`;
a.click();
URL.revokeObjectURL(url);
}

// --- Helpers ---
function escapeHtml(text) {
const div = document.createElement('div');
div.textContent = text;
return div.innerHTML;
}

function escapeForJS(text) {
return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
}
</script>
</body>
</html>
